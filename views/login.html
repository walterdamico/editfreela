<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - EditFreela</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light">

    <!-- Barra de Navegação -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">EditFreela</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/mural">Mural de Vagas</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/login">Entrar</a>
                    </li>
                    <li class="nav-item">
                        <a class="btn btn-primary ms-2" href="/cadastro">Cadastre-se</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Formulário de Login -->
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-4">
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <h3 class="card-title text-center mb-4 fw-bold">Entrar</h3>
                        
                        <!-- O 'novalidate' desativa os alertas feios do navegador para usarmos os nossos -->
                        <form id="formLogin" action="/login" method="POST" novalidate>
                            
                            <!-- Campo E-mail -->
                            <div class="mb-3">
                                <label for="email" class="form-label">E-mail</label>
                                <input type="email" class="form-control" id="email" name="email" required>
                                <div class="invalid-feedback" id="erroEmail">
                                    Por favor, insira um e-mail válido.
                                </div>
                            </div>

                            <!-- Campo Senha -->
                            <div class="mb-3">
                                <label for="senha" class="form-label">Senha</label>
                                <input type="password" class="form-control" id="senha" name="senha" required>
                                <div class="invalid-feedback" id="erroSenha">
                                    A senha não pode estar vazia.
                                </div>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 mt-2">Acessar Conta</button>
                        </form>
                        
                        <div class="text-center mt-4">
                            <p class="mb-0">Ainda não tem conta? <a href="/cadastro" class="text-decoration-none">Cadastre-se</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Lógica de Validação Front-End -->
    <script>
        document.getElementById('formLogin').addEventListener('submit', function(event) {
            let formValido = true;
            
            // Capturar os campos
            const email = document.getElementById('email');
            const senha = document.getElementById('senha');
            
            // Limpar os erros anteriores
            email.classList.remove('is-invalid');
            senha.classList.remove('is-invalid');

            // 1. Verificar E-mail (Se está vazio ou se não tem formato de e-mail)
            const regexEmail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!email.value.trim() || !regexEmail.test(email.value)) {
                email.classList.add('is-invalid');
                formValido = false;
            }

            // 2. Verificar Senha (exemplo: não pode estar vazia e mínimo 6 caracteres)
            if (!senha.value.trim() || senha.value.length < 6) {
                document.getElementById('erroSenha').textContent = 'A senha deve ter pelo menos 6 caracteres.';
                senha.classList.add('is-invalid');
                formValido = false;
            }

            // Se algo estiver errado, impede a página de enviar os dados para o servidor
            if (!formValido) {
                event.preventDefault(); 
            }
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
