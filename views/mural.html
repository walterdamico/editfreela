<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mural de Vagas - EditFreela</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/mural">EditFreela</a>
            <div class="d-flex align-items-center">
                <a class="btn btn-outline-light btn-sm me-3" href="/perfil">Configurar Perfil</a>
                <div class="text-white text-start me-3 lh-sm">
                    <span id="nomeUsuario" class="fw-bold d-block">Carregando...</span>
                    <small id="funcaoUsuario" class="text-muted text-uppercase" style="font-size: 0.75rem; letter-spacing: 0.5px; color: #a0a0a0 !important;">Carregando...</small>
                </div>
                <a class="btn btn-outline-danger btn-sm" href="/logout">Sair</a>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="fw-bold">Mural de Vagas</h2>
                <p class="text-muted" id="subtituloPerfil">Carregando informações...</p>
            </div>
            <button id="btnCriarVaga" class="btn btn-success d-none" onclick="abrirModalCriar()">
                Publicar Nova Vaga
            </button>
        </div>

        <div class="row" id="listaVagas"></div>
    </div>

    <div class="modal fade" id="modalVaga" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold" id="modalVagaLabel">Publicar Vaga</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form id="formVaga">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Título da Vaga</label>
                            <input type="text" class="form-control" id="vagaTitulo" placeholder="Ex: Edição de Vídeo para YouTube - Canal de Finanças" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Descrição do Projeto</label>
                            <textarea class="form-control" id="vagaDescricao" rows="5" placeholder="Insira as informações necessárias para o editor (Exemplo: Duração estimada do vídeo, para qual finalidade/plataforma ele serve, ritmo da edição, estilo visual e referências)." required></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Orçamento Estimado (R$)</label>
                            <input type="number" step="0.01" class="form-control" id="vagaOrcamento" placeholder="Ex: 250.00" required>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-success">Salvar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modalSolicitacoes" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold">Editores Interessados</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div id="listaCandidatos"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let usuarioLogado = null;
        let idVagaSendoEditada = null; 
        let vagasCarregadasMemoria = []; 

        const bootstrapModalVaga = new bootstrap.Modal(document.getElementById('modalVaga'));
        const bootstrapModalSol = new bootstrap.Modal(document.getElementById('modalSolicitacoes'));

        document.addEventListener("DOMContentLoaded", async () => {
            const respostaUsuario = await fetch('/api/usuario');
            usuarioLogado = await respostaUsuario.json();
            
            document.getElementById('nomeUsuario').innerText = usuarioLogado.nome;
            const funcaoTexto = usuarioLogado.tipo === 'cliente' ? 'Contratante' : 'Editor de Vídeo';
            document.getElementById('funcaoUsuario').innerText = funcaoTexto;
            
            if (usuarioLogado.tipo === 'cliente') {
                document.getElementById('subtituloPerfil').innerText = "Gerencie suas vagas enviadas ou crie novas.";
                document.getElementById('btnCriarVaga').classList.remove('d-none');
            } else {
                document.getElementById('subtituloPerfil').innerText = "Encontre e envie solicitações de interesse.";
            }

            carregarVagas();
        });

async function carregarVagas() {
            const res = await fetch('/api/vagas');
            const vagas = await res.json();
            vagasCarregadasMemoria = vagas; 
            
            const container = document.getElementById('listaVagas');
            container.innerHTML = vagas.length === 0 ? '<p class="text-muted text-center py-5">Nenhuma vaga registrada.</p>' : '';

            vagas.forEach(vaga => {
                let botoesHtml = '';
                let badgeStatusGlobal = '';

                if (vaga.vaga_aceita) {
                    badgeStatusGlobal = `<span class="badge bg-success mb-2 d-inline-block fw-bold fs-6">ACEITA</span>`;
                }

                if (usuarioLogado.tipo === 'cliente') {
                    if (vaga.cliente_id === usuarioLogado.id) {
                        if (vaga.vaga_aceita) {
                            const nomeEscapado = (vaga.editor_nome || '').replace(/'/g, "\\'");
                            const whatsappEscapado = (vaga.editor_whatsapp || '').replace(/'/g, "\\'");
                            const emailEscapado = (vaga.editor_email || '').replace(/'/g, "\\'");
                            const youtubeEscapado = (vaga.editor_youtube || 'Não informado').replace(/'/g, "\\'");
                            const descEscapada = (vaga.editor_descricao || 'Sem descrição informada.').replace(/'/g, "\\'").replace(/\n/g, "\\n").replace(/\r/g, "");

                            botoesHtml = `
                                <div class="text-success small fw-bold text-center border p-2 bg-white rounded mb-2">
                                    Contratação concluída. Esta vaga está finalizada e trancada.
                                </div>
                                <button class="btn btn-info btn-sm text-white w-100 fw-bold" 
                                    onclick="verEditorContratado('${nomeEscapado}', '${whatsappEscapado}', '${emailEscapado}', '${youtubeEscapado}', '${descEscapada}')">
                                     Ver Informações do Editor
                                </button>
                            `;
                        } else {
                            botoesHtml = `
                                <button class="btn btn-warning btn-sm me-1" onclick="abrirModalEditar(${vaga.id})">Editar</button>
                                <button class="btn btn-danger btn-sm me-1" onclick="excluirVaga(${vaga.id})">Excluir</button>
                                <button class="btn btn-info text-white btn-sm" onclick="verSolicitacoes(${vaga.id})">Candidatos (${vaga.total_solicitacoes})</button>
                            `;
                        }
                    } else {
                        botoesHtml = `<span class="text-muted small">Vaga de outro contratante</span>`;
                    }
                } else {
                    if (vaga.vaga_aceita) {
                        if (vaga.meu_status === 'aprovada') {
                            botoesHtml = `<div class="alert alert-success py-1 px-2 m-0 text-center fw-bold small">Solicitação Aceita, o Contratante Entrará em Contato</div>`;
                        } else {
                            botoesHtml = `<div class="alert alert-danger py-1 px-2 m-0 text-center fw-bold small">Solicitação Recusada</div>`;
                        }
                    } else {
                        if (!vaga.meu_status) {
                            botoesHtml = `<button class="btn btn-primary btn-sm w-100" onclick="candidatarVaga(${vaga.id})">Enviar Interesse</button>`;
                        } else if (vaga.meu_status === 'pendente') {
                            botoesHtml = `
                                <div class="alert alert-warning py-1 px-2 mb-2 text-center fw-bold small">Solicitação Pendente</div>
                                <button class="btn btn-outline-danger btn-sm w-100" onclick="cancelarSolicitacao(${vaga.id})">Cancelar Solicitação</button>
                            `;
                        } else if (vaga.meu_status === 'recusada') {
                            botoesHtml = `<div class="alert alert-danger py-1 px-2 m-0 text-center fw-bold small">Solicitação Recusada</div>`;
                        }
                    }
                }

                container.innerHTML += `
                    <div class="col-md-6 col-lg-4 mb-4">
                        <div class="card h-100 border-0 shadow-sm p-3">
                            <div class="d-flex justify-content-between align-items-start">
                                <span class="badge bg-secondary mb-2">#${vaga.id}</span>
                                ${badgeStatusGlobal}
                            </div>
                            <h5 class="fw-bold text-dark">${vaga.titulo}</h5>
                            <p class="text-muted" style="white-space: pre-wrap;">${vaga.descricao}</p>
                            <hr>
                            <p class="mb-1 small">Contratante: <strong>${vaga.contratante}</strong></p>
                            <p class="text-success fw-bold mb-3">R$ ${parseFloat(vaga.orcamento).toFixed(2)}</p>
                            <div class="mt-auto">${botoesHtml}</div>
                        </div>
                    </div>`;
            });
        }

        function abrirModalCriar() {
            idVagaSendoEditada = null;
            document.getElementById('modalVagaLabel').innerText = "Publicar Nova Oportunidade";
            document.getElementById('formVaga').reset();
            bootstrapModalVaga.show();
        }

        function abrirModalEditar(id) {
            idVagaSendoEditada = id;
            const vaga = vagasCarregadasMemoria.find(v => v.id === id);
            
            document.getElementById('modalVagaLabel').innerText = "Editar Oportunidade";
            document.getElementById('vagaTitulo').value = vaga.titulo;
            document.getElementById('vagaDescricao').value = vaga.descricao;
            document.getElementById('vagaOrcamento').value = vaga.orcamento;
            bootstrapModalVaga.show();
        }

        document.getElementById('formVaga').addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                titulo: document.getElementById('vagaTitulo').value,
                descricao: document.getElementById('vagaDescricao').value,
                orcamento: document.getElementById('vagaOrcamento').value
            };

            const url = idVagaSendoEditada ? `/api/vagas/${idVagaSendoEditada}` : '/api/vagas';
            const metodo = idVagaSendoEditada ? 'PUT' : 'POST';

            const res = await fetch(url, {
                method: metodo,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if(res.ok) {
                bootstrapModalVaga.hide();
                carregarVagas();
            } else {
                alert("Nao foi possivel salvar. Esta vaga pode ter sido finalizada.");
            }
        });

        async function excluirVaga(id) {
            if (confirm("Deseja mesmo excluir?")) {
                const res = await fetch(`/api/vagas/${id}`, { method: 'DELETE' });
                if(res.ok) {
                    carregarVagas();
                } else {
                    alert("Esta vaga ja foi aceita e nao pode ser excluida.");
                }
            }
        }

        async function candidatarVaga(id) {
            if (!usuarioLogado.whatsapp) {
                alert("Atencao! Voce precisa cadastrar seu numero de WhatsApp nas configuracoes de perfil antes de se candidatar.");
                window.location.href = '/perfil';
                return;
            }
            await fetch(`/api/vagas/${id}/candidatar`, { method: 'POST' });
            alert("Interesse enviado!");
            carregarVagas();
        }

        async function cancelarSolicitacao(id) {
            if (confirm("Tem certeza que deseja remover seu interesse desta vaga?")) {
                await fetch(`/api/vagas/${id}/cancelar`, { method: 'DELETE' });
                carregarVagas();
            }
        }

        //CONTROLADOR DE CANDIDATOS DO CLIENTE
        async function verSolicitacoes(vagaId) {
            const res = await fetch(`/api/vagas/${vagaId}/solicitacoes`);
            const sols = await res.json();
            const listContainer = document.getElementById('listaCandidatos');
            
            listContainer.innerHTML = sols.length === 0 ? '<p class="text-muted p-3 text-center">Nenhum editor se candidatou ainda.</p>' : '';

            sols.forEach(s => {
                let acoes = '';
                if (s.status === 'pendente') {
                    acoes = `
                        <button class="btn btn-success btn-sm me-1" onclick="atualizarStatusSolicitacao(${s.id}, 'aprovada', ${vagaId})">Aceitar</button>
                        <button class="btn btn-danger btn-sm" onclick="atualizarStatusSolicitacao(${s.id}, 'recusada', ${vagaId})">Recusar</button>
                    `;
                } else if (s.status === 'aprovada') {
                    acoes = `<span class="badge bg-success p-2">Aprovado</span>`;
                } else {
                    acoes = `<span class="badge bg-secondary p-2">Recusado</span>`;
                }

                const ytLink = s.youtube ? `<a href="${s.youtube}" target="_blank" class="text-primary fw-bold">${s.youtube}</a>` : '<span class="text-muted">Não inserido</span>';
                const waNumero = s.whatsapp ? `<span class="text-dark fw-bold">${s.whatsapp}</span>` : '<span class="text-muted">Não inserido</span>';
                const emailTexto = s.email ? `<span class="text-dark fw-bold">${s.email}</span>` : '<span class="text-muted">Não inserido</span>';
                const descTexto = s.descricao ? s.descricao : '<span class="text-muted fst-italic">O usuário ainda não escreveu uma descrição no perfil.</span>';

                listContainer.innerHTML += `
                    <div class="card p-3 mb-2 border rounded shadow-sm bg-white">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <strong class="fs-5 text-dark">${s.editor_nome}</strong>
                                <span class="badge bg-light text-dark ms-2 border">Status: ${s.status.toUpperCase()}</span>
                            </div>
                            <div>${acoes}</div>
                        </div>
                        
                        <div class="mt-2">
                            <button class="btn btn-sm btn-outline-secondary" type="button" onclick="document.getElementById('perfil-box-${s.id}').classList.toggle('d-none')">
                                Visualizar Perfil Completo
                            </button>
                        </div>
                        
                        <div id="perfil-box-${s.id}" class="d-none mt-3 p-3 bg-light border rounded">
                            <h6 class="fw-bold text-dark mb-2">Sobre o Editor:</h6>
                            <p class="small text-muted mb-3" style="white-space: pre-wrap;">${descTexto}</p>
                            <hr class="text-secondary">
                            <p class="mb-1 small"><strong>E-mail:</strong> ${emailTexto}</p>
                            <p class="mb-1 small"><strong>WhatsApp:</strong> ${waNumero}</p>
                            <p class="mb-0 small"><strong>Portfólio:</strong> ${ytLink}</p>
                        </div>
                    </div>`;
            });

            bootstrapModalSol.show();
        }

        async function atualizarStatusSolicitacao(solId, novoStatus, vagaId) {
            await fetch(`/api/solicitacoes/${solId}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ status: novoStatus, vagaId: vagaId })
            });
            
            if(novoStatus === 'aprovada') {
                bootstrapModalSol.hide();
            } else {
                verSolicitacoes(vagaId);
            }
            carregarVagas();
        }

        function verEditorContratado(nome, whatsapp, email, youtube, descricao) {
            alert(
                "DADOS DO EDITOR CONTRATADO\n\n" +
                "Nome: " + nome + "\n" +
                "WhatsApp: " + whatsapp + "\n" +
                "E-mail: " + email + "\n" +
                "Portfólio: " + youtube + "\n\n" +
                "Sobre o editor:\n" + descricao
            );
        }

    </script>
</body>
</html>
