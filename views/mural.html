<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mural de Vagas - EditFreela</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">EditFreela</a>
            <div class="d-flex align-items-center">
                <span class="text-white me-3" id="boasVindas">Carregando...</span>
                <a class="btn btn-outline-danger btn-sm" href="/logout">Sair</a>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="fw-bold">Mural de Vagas</h2>
                <p class="text-muted" id="subtituloPerfil">Aqui estão as oportunidades disponíveis.</p>
            </div>
            
            <button id="btnCriarVaga" class="btn btn-success d-none">
                + Publicar Nova Vaga
            </button>
        </div>

        <div class="row" id="listaVagas">
            <div class="col-12 text-center py-5">
                <p class="text-muted fs-5">Nenhuma vaga publicada no momento. Seja o primeiro a criar uma!</p>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", async function() {
            try {
                // Vai ao servidor perguntar quem está logado
                const resposta = await fetch('/api/usuario');
                const usuario = await resposta.json();

                if (usuario.nome) {
                    // Atualiza os textos na tela
                    document.getElementById('boasVindas').innerHTML = `Olá, <strong>${usuario.nome}</strong>!`;
                    
                    if (usuario.tipo === 'cliente') {
                        document.getElementById('subtituloPerfil').innerText = "Encontre os melhores editores para o seu projeto.";
                        // Mostra o botão de criar vaga APENAS para os clientes!
                        document.getElementById('btnCriarVaga').classList.remove('d-none');
                    } else {
                        document.getElementById('subtituloPerfil').innerText = "Encontre o projeto perfeito para editar hoje.";
                    }
                }
            } catch (erro) {
                console.error("Erro ao carregar dados do usuário:", erro);
            }
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
