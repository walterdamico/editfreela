<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Perfil - EditFreela</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/mural">← Voltar ao Mural</a>
        </div>
    </nav>

    <div class="container mt-5" style="max-width: 600px;">
        <div class="card shadow border-0 p-4">
            <h3 class="fw-bold text-dark mb-3">Configurações do Perfil</h3>
            <p class="text-muted">Mantenha seus dados atualizados para que os contratantes possam te encontrar.</p>
            
            <form id="formPerfil">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Número do WhatsApp (com DDD)</label>
                    <input type="text" class="form-control" id="whatsapp" placeholder="Ex: 24999998888" required>
                    <small class="text-muted">Apenas números. Será usado para gerar o link direto de conversa.</small>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Link do Canal do YouTube (Opcional)</label>
                    <input type="url" class="form-control" id="youtube" placeholder="https://youtube.com/seu-canal">
                    <small class="text-muted">Insira seu portfólio de edições se tiver.</small>
                </div>

                <button type="submit" class="btn btn-primary w-100 fw-bold mt-3">Salvar Alterações</button>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            // Carrega os dados atuais do banco para preencher o form
            const res = await fetch('/api/usuario');
            const user = await res.json();
            
            if (user.whatsapp) document.getElementById('whatsapp').value = user.whatsapp;
            if (user.youtube) document.getElementById('youtube').value = user.youtube;
        });

        document.getElementById('formPerfil').addEventListener('submit', async (e) => {
            e.preventDefault();
            const whatsapp = document.getElementById('whatsapp').value;
            const youtube = document.getElementById('youtube').value;

            const res = await fetch('/api/perfil', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ whatsapp, youtube })
            });

            const dados = await res.json();
            if (dados.sucesso) {
                alert("Perfil atualizado com sucesso!");
                window.location.href = '/mural';
            } else {
                alert("Erro ao atualizar perfil.");
            }
        });
    </script>
</body>
</html>
